<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>local-life-os — Routines</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">local<span class="accent">·</span>life<span class="accent">·</span>os</span>
    <nav class="nav" id="nav"></nav>
  </div>

  <div class="card">
    <div class="formrow">
      <input id="r-title" placeholder="new routine…" style="flex:1;min-width:200px">
      <select id="r-cadence">
        <option value="FREQ=DAILY">daily</option>
        <option value="FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR">weekdays</option>
        <option value="FREQ=WEEKLY">weekly</option>
        <option value="FREQ=MONTHLY">monthly</option>
      </select>
      <input id="r-target" type="number" placeholder="target / period" style="width:130px">
      <button class="primary" id="add">Add</button>
    </div>
  </div>

  <div class="col-grid" id="out"></div>
</div>

<script type="module">
import { $, esc, api, toast, modal } from '/ui.js';

const byId = new Map();
const CADENCES = ['FREQ=DAILY','FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR','FREQ=WEEKLY','FREQ=MONTHLY'];
function human(rrule){
  if(!rrule) return '—';
  if(rrule==='FREQ=DAILY') return 'daily';
  if(rrule==='FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR') return 'weekdays';
  if(rrule.startsWith('FREQ=WEEKLY;BYDAY=')) return rrule.split('BYDAY=')[1].toLowerCase().replace(/,/g,'/');
  if(rrule==='FREQ=WEEKLY') return 'weekly';
  if(rrule==='FREQ=MONTHLY') return 'monthly';
  return rrule;
}

async function load(){
  const { records } = await api('/api/records/by?category=routines');
  byId.clear(); records.forEach(r=>byId.set(r.id,r));
  $('#out').innerHTML = records.length ? records.map(card).join('') : '<p class="empty">No routines yet. Add one above.</p>';
}

function card(r){
  const e=r.extras||{};
  return `<div class="rec">
    <div class="top"><strong>${esc(r.headline)}</strong><span class="pill">↻ ${esc(human(e.cadence_rrule))}</span></div>
    <div class="muted" style="font-size:12.5px;margin-top:4px">
      ${e.target_per_period?`target ${e.target_per_period}/period · `:''}${e.occurrence_category?'logs to '+esc(e.occurrence_category):''}</div>
    ${e.motivation?`<div style="font-size:12.5px;margin-top:4px">“${esc(e.motivation)}”</div>`:''}
    <div class="acts"><button class="mini" data-edit="${r.id}">edit</button></div>
  </div>`;
}

$('#add').onclick = async ()=>{
  const title=$('#r-title').value.trim(); if(!title){ toast('title required','err'); return; }
  await api('/api/records/add', { category:'routines', headline:title, state:'active',
    extras:{ title, cadence_rrule:$('#r-cadence').value, target_per_period:+$('#r-target').value||null,
      occurrence_category:'tasks', adherence_window_days:1, motivation:null } });
  $('#r-title').value=''; $('#r-target').value=''; toast('added','ok'); load();
};

async function edit(id){
  const r=byId.get(id), e=r.extras||{};
  const v = await modal('Edit routine', [
    { key:'title', label:'Title', value:r.headline },
    { key:'cadence_rrule', label:'Cadence', type:'select', options:CADENCES, value:e.cadence_rrule||'FREQ=DAILY' },
    { key:'target_per_period', label:'Target/period', type:'number', value:e.target_per_period??'' },
    { key:'occurrence_category', label:'Logs to', value:e.occurrence_category||'tasks' },
    { key:'motivation', label:'Motivation', type:'textarea', value:e.motivation||'' },
  ], { extraButtons:[{ label:'Archive', kind:'ghost', value:'archived' }] });
  if(!v) return;
  if(v.__action==='archived'){ await api('/api/records/update',{id,state:'archived'}); toast('archived','ok'); load(); return; }
  await api('/api/records/update', { id, headline:v.title,
    extras:{ ...e, title:v.title, cadence_rrule:v.cadence_rrule, target_per_period:+v.target_per_period||null, occurrence_category:v.occurrence_category||'tasks', motivation:v.motivation||null } });
  toast('saved','ok'); load();
}

document.body.addEventListener('click',(e)=>{ const b=e.target.closest('button[data-edit]'); if(b) edit(b.dataset.edit); });
load();
</script>
</body>
</html>
