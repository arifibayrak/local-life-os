<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>local-life-os — Learnings</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">local<span class="accent">·</span>life<span class="accent">·</span>os</span>
    <nav class="nav" id="nav"></nav>
  </div>

  <div class="card">
    <div class="formrow">
      <input id="l-title" placeholder="what did you learn? (topic)" style="flex:1;min-width:200px">
      <select id="l-skind"><option value="">source…</option><option>book</option><option>person</option><option>lecture</option><option>article</option><option>podcast</option><option>self</option><option>other</option></select>
      <input id="l-sname" placeholder="source name" style="width:130px">
      <input id="l-tags" placeholder="tags (csv)" style="width:120px">
      <button class="primary" id="add">Add</button>
      <button class="btn ghost" id="open-chat">🗨 Discuss</button>
    </div>
    <textarea id="l-summary" rows="2" placeholder="the insight / summary…" style="width:100%;margin-top:8px"></textarea>
  </div>

  <div class="col-grid" id="out"></div>
</div>

<!-- AI chat drawer -->
<div class="drawer" id="drawer">
  <div class="dh">
    <strong>Discuss · <span class="muted" style="font-weight:400">Qwen (local)</span></strong>
    <span title="Send this question to a cloud model for live web search">
      <button class="mini" data-llm="claude">↗ Claude</button>
      <button class="mini" data-llm="chatgpt">↗ ChatGPT</button>
      <button class="mini" data-llm="gemini">↗ Gemini</button>
      <button class="mini" id="close-chat">✕</button>
    </span>
  </div>
  <div class="chat">
    <div class="log" id="log"><div class="msg sys">Ask about a learning or a thought. "✦ discuss" on a card loads it here.</div></div>
    <div class="composer">
      <label class="muted" style="font-size:11px;align-self:center;white-space:nowrap" title="Ground the answer with a Wikipedia summary (only the topic title is sent)"><input type="checkbox" id="web"> 🌐</label>
      <textarea id="msg" rows="1" placeholder="message…"></textarea><button class="primary" id="send">Send</button>
    </div>
  </div>
</div>

<script type="module">
import { $, esc, api, toast } from '/ui.js';

const byId = new Map();
const ICON = { book:'📖', person:'🧑', lecture:'🎓', article:'📰', podcast:'🎧', self:'💡', other:'•' };
function md(s){
  let h=esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g,'$1<em>$2</em>');
  const lines=h.split('\n'); const out=[]; let list=null;
  const close=()=>{ if(list){ out.push('</'+list+'>'); list=null; } };
  for(const line of lines){
    let m;
    if(m=line.match(/^\s*#{1,4}\s+(.*)/)){ close(); out.push('<div class="h">'+m[1]+'</div>'); }
    else if(m=line.match(/^\s*\d+[.)]\s+(.*)/)){ if(list!=='ol'){close(); out.push('<ol>'); list='ol';} out.push('<li>'+m[1]+'</li>'); }
    else if(m=line.match(/^\s*[-•*]\s+(.*)/)){ if(list!=='ul'){close(); out.push('<ul>'); list='ul';} out.push('<li>'+m[1]+'</li>'); }
    else if(line.trim()===''){ close(); }
    else { close(); out.push('<div>'+line+'</div>'); }
  }
  close(); return out.join('');
}

async function load(){
  const { records } = await api('/api/records/by?category=learnings');
  byId.clear(); records.forEach(r=>byId.set(r.id,r));
  $('#out').innerHTML = records.length ? records.map(card).join('') : '<p class="empty">No learnings yet. Add one above.</p>';
}

function card(r){
  const e=r.extras||{};
  const icon = ICON[e.source_kind] || '🔖';
  const src = (e.source_name||e.source_kind) ? `<span class="pill">${icon} ${esc([e.source_kind,e.source_name].filter(Boolean).join(' · '))}</span>` : '';
  const tags = (e.topic_tags||[]).map(t=>`<span class="pill">#${esc(t)}</span>`).join(' ');
  return `<div class="rec lcard">
    <div class="ltitle">${esc(r.headline)}</div>
    ${e.summary?`<div class="lsum clamp">${esc(e.summary)}</div>`:''}
    <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:5px">${src}${tags}</div>
    <div class="acts">
      <button class="mini" data-explain="${r.id}">✨ explain</button>
      <button class="mini" data-wiki="${r.id}">🔍 context</button>
      <button class="mini" data-discuss="${r.id}">✦ discuss</button>
      <button class="mini" data-del="${r.id}">🗑</button>
    </div>
    <div class="lout" data-out="${r.id}"></div>
  </div>`;
}

$('#add').onclick = async ()=>{
  const title=$('#l-title').value.trim(); if(!title){ toast('topic required','err'); return; }
  await api('/api/records/add', { category:'learnings', headline:title, state:'active',
    extras:{ summary:$('#l-summary').value||null, source_kind:$('#l-skind').value||null, source_name:$('#l-sname').value||null,
      topic_tags:$('#l-tags').value.split(',').map(s=>s.trim()).filter(Boolean) } });
  ['l-title','l-sname','l-tags','l-summary'].forEach(i=>$('#'+i).value=''); toast('added','ok'); load();
};

// ✨ AI explain — standardized breakdown via local Qwen
async function explain(id){
  const r=byId.get(id); const box=document.querySelector(`[data-out="${id}"]`);
  box.innerHTML='<div class="aibox muted">thinking…</div>';
  const prompt = `Break down this learning concisely in four short labelled parts using **bold** headers and bullets:\n**What it is** — one line.\n**Why it matters** — one line.\n**Key points** — 2-3 bullets.\n**Related concepts** — a few comma-separated.\n\nTopic: "${r.headline}".`+(r.extras?.summary?` My note: ${r.extras.summary}`:'');
  try{
    const res=await api('/api/chat',{ messages:[{role:'user',content:prompt}] });
    box.innerHTML = res.error ? `<div class="aibox">model error: ${esc(res.error)}</div>` : `<div class="aibox">${md(res.reply)}</div>`;
  }catch{ box.innerHTML='<div class="aibox">failed</div>'; }
}

// 🔍 Wikipedia context (safe — only the topic title is sent)
async function wiki(id){
  const r=byId.get(id); const box=document.querySelector(`[data-out="${id}"]`);
  box.innerHTML='<div class="wikibox muted">looking up…</div>';
  try{
    const w=await api('/api/wiki?q='+encodeURIComponent(r.headline));
    if(w.error||!w.found){ box.innerHTML='<div class="wikibox">no encyclopedia entry found</div>'; return; }
    box.innerHTML=`<div class="wikibox">${w.thumbnail?`<img src="${esc(w.thumbnail)}" alt="">`:''}
      <div><strong>${esc(w.title)}</strong><div>${esc(w.extract)}</div>${w.url?`<a href="${esc(w.url)}" target="_blank" rel="noopener">Wikipedia ↗</a>`:''}</div></div>`;
  }catch{ box.innerHTML='<div class="wikibox">lookup failed</div>'; }
}

// ✦ Discuss — open drawer seeded with the learning
const SYSTEM='You are an expert thinking partner for a sharp, MBA-level operator. Discuss the user\'s learnings, ideas, and progress with depth and precision. Use markdown: short **bold** headers and tight bullets/numbered lists. Be substantive — give the real concept, a concrete worked example, common pitfalls, and 2-3 specific next steps (and, when relevant, named frameworks/books/people to explore). Stay focused, not shallow. If a question needs live web data you do not have, say so in one line and suggest exactly what to search.';
let messages=[{role:'system',content:SYSTEM}];
function renderChat(){ $('#log').innerHTML = messages.filter(m=>m.role==='user'||m.role==='assistant').map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}">${m.role==='user'?esc(m.content):md(m.content)}</div>`).join('')||'<div class="msg sys">…</div>'; $('#log').scrollTop=1e9; }
async function send(text){ if(!text.trim())return;
  if($('#web')?.checked){ try{ const w=await api('/api/wiki?q='+encodeURIComponent(text)); if(w.found) messages.push({role:'system',content:`Reference (Wikipedia — "${w.title}"): ${w.extract}`}); }catch{} }
  messages.push({role:'user',content:text}); renderChat();
  $('#log').insertAdjacentHTML('beforeend','<div class="typing" id="typing">thinking…</div>'); $('#log').scrollTop=1e9;
  try{ const res=await api('/api/chat',{messages}); $('#typing')?.remove(); messages.push({role:'assistant',content:res.error?('(error: '+res.error+')'):res.reply}); renderChat(); }
  catch{ $('#typing')?.remove(); toast('chat failed','err'); } }
const openDrawer=()=>$('#drawer').classList.add('open'); const closeDrawer=()=>$('#drawer').classList.remove('open');
$('#open-chat').onclick=openDrawer; $('#close-chat').onclick=closeDrawer;
function handoff(provider){
  const last=[...messages].reverse().find(m=>m.role==='user');
  const text=(last?last.content:'')+'\n\nAnswer using current web information and cite sources.';
  const q=encodeURIComponent(text);
  if(provider==='gemini'){ navigator.clipboard?.writeText(text).catch(()=>{}); window.open('https://gemini.google.com/app','_blank','noopener'); toast('prompt copied — paste into Gemini','ok'); return; }
  window.open((provider==='claude'?'https://claude.ai/new?q=':'https://chatgpt.com/?q=')+q,'_blank','noopener');
}
$('#send').onclick=()=>{ const t=$('#msg').value; $('#msg').value=''; send(t); };
$('#msg').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); $('#send').click(); } });

document.body.addEventListener('click',(e)=>{
  const lm=e.target.closest('button[data-llm]'); if(lm) return handoff(lm.dataset.llm);
  const ex=e.target.closest('button[data-explain]'); if(ex) return explain(ex.dataset.explain);
  const wk=e.target.closest('button[data-wiki]'); if(wk) return wiki(wk.dataset.wiki);
  const ds=e.target.closest('button[data-discuss]'); if(ds){ const r=byId.get(ds.dataset.discuss),x=r.extras||{};
    messages=messages.slice(0,1); renderChat(); openDrawer();
    send(`Let's discuss "${r.headline}".`+(x.summary?` My note: ${x.summary}`:'')); return; }
  const dl=e.target.closest('button[data-del]'); if(dl){ if(!confirm('Delete this learning?')) return; api('/api/records/delete',{id:dl.dataset.del}).then(()=>{ toast('deleted','ok'); load(); }); return; }
});
load();
</script>
</body>
</html>
