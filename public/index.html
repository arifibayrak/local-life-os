<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>local-life-os — Capture</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="dot" id="dot" title="model status"></span>
    <span class="brand">local<span class="accent">·</span>life<span class="accent">·</span>os</span>
    <nav class="nav">
      <a href="/" class="active">Capture</a>
      <a href="/todos">Todos</a>
      <a href="/projects">Projects</a>
      <a href="/events">Events</a>
      <a href="/ideas">Ideas</a>
      <a href="/finance">Finance</a>
      <a href="/network">Network</a>
    </nav>
  </div>

  <p class="statusline" id="status">starting…</p>

  <div id="feed"></div>
  <div id="proposals"></div>

  <div class="card">
    <textarea id="box" rows="2" placeholder="Dump a thought… (Enter to send, Shift+Enter for newline)" style="width:100%"></textarea>
    <div class="formrow" style="margin-top:10px">
      <button class="btn" id="send">Capture</button>
      <button class="btn ghost" id="mic">● Voice</button>
      <button class="btn ghost" id="close">End session → review</button>
    </div>
  </div>
  <p class="muted" style="font-size:12.5px">Everything stays on this machine. A session auto-ends after idle; "End session" runs Qwen now.</p>
</div>

<script type="module">
const $ = (s) => document.querySelector(s);
const feed = $('#feed'), proposals = $('#proposals');
let captures = [];
const api = async (path, body) => (await fetch(path, body ? { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) } : {})).json();
const esc = (s) => String(s ?? '').replace(/</g,'&lt;');

async function health() {
  try {
    const h = await api('/api/health');
    $('#dot').classList.toggle('ok', !!h.llm);
    $('#status').textContent = h.llm ? 'model ready' : 'model offline — run: npm run model';
  } catch { $('#status').textContent = 'daemon offline'; }
}
function renderFeed() { feed.innerHTML = captures.map((c) => `<div class="cap">${esc(c)}</div>`).join(''); }

async function capture() {
  const text = $('#box').value.trim(); if (!text) return;
  captures.push(text); renderFeed(); $('#box').value = '';
  await api('/api/capture', { text });
}

function renderProposals(pending) {
  if (!pending) { proposals.innerHTML = ''; return; }
  if (pending.records.length === 0) { proposals.innerHTML = '<p class="empty">No records extracted from that session.</p>'; return; }
  proposals.innerHTML = '<h2 class="section-title">Review</h2>' + pending.records.map((r, i) => `
    <div class="rec">
      <div class="top"><strong>${esc(r.headline)}</strong><span class="pill">${esc(r.category)}</span></div>
      <dl>${Object.entries(r.extras||{}).filter(([,v])=>v!=null&&v!==''&&!(Array.isArray(v)&&!v.length)).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(Array.isArray(v)?v.join(', '):v)}</dd>`).join('')}</dl>
      <label style="margin-top:8px;display:block"><input type="checkbox" data-i="${i}" checked> approve</label>
    </div>`).join('') +
    `<div class="formrow" style="margin-top:10px"><button class="btn" id="persist">Save approved</button><button class="btn ghost" id="discard">Discard all</button></div>`;
  $('#persist').onclick = async () => {
    const approve = [...proposals.querySelectorAll('input:checked')].map((el) => +el.dataset.i);
    const res = await api('/api/validate', { approve });
    captures = []; renderFeed(); renderProposals(null);
    $('#status').textContent = `saved ${res.persisted} record(s)`;
  };
  $('#discard').onclick = async () => { await api('/api/validate', { approve: [] }); captures = []; renderFeed(); renderProposals(null); };
}

$('#send').onclick = capture;
$('#box').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); capture(); } });
$('#close').onclick = async () => {
  $('#status').textContent = 'extracting with Qwen…';
  const res = await api('/api/close', {});
  renderProposals(res.pending);
  $('#status').textContent = 'review the proposed records';
};

let rec, chunks = [];
$('#mic').onclick = async () => {
  if (rec && rec.state === 'recording') { rec.stop(); $('#mic').textContent = '● Voice'; return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  rec = new MediaRecorder(stream); chunks = [];
  rec.ondataavailable = (e) => chunks.push(e.data);
  rec.onstop = async () => {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const b64 = btoa(String.fromCharCode(...new Uint8Array(await blob.arrayBuffer())));
    $('#status').textContent = 'transcribing…';
    const res = await api('/api/voice', { audioBase64: b64, ext: 'webm' });
    if (res.error) { $('#status').textContent = 'voice: ' + res.error; return; }
    captures.push(res.text); renderFeed(); $('#status').textContent = 'transcribed';
  };
  rec.start(); $('#mic').textContent = '■ Stop';
};

health(); setInterval(health, 10000);
</script>
</body>
</html>
