<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>local-life-os — Network</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="brand">local<span class="accent">·</span>life<span class="accent">·</span>os</span>
    <nav class="nav" id="nav"></nav>
  </div>

  <div class="cards" id="stats"></div>

  <div id="reconnect"></div>

  <div class="card">
    <div class="formrow">
      <input id="c-name" placeholder="name" style="width:150px">
      <input id="c-role" placeholder="role" style="width:130px">
      <input id="c-company" placeholder="company" style="width:140px">
      <select id="c-circle"><option value="professional">professional</option><option value="friends">friends</option><option value="family">family</option><option value="other">other</option></select>
      <button class="primary" id="add">Add contact</button>
    </div>
  </div>

  <div id="out"></div>
</div>

<script type="module">
import { $, esc, api, toast, modal, wireGroups, groupBlock } from '/ui.js';

const CIRCLES = ['professional','friends','family','other'];
const TYPES = ['coffee','call','message','meeting','event','other'];
const STRENGTHS = ['','active','warm','cold','dormant'];
const byId = new Map();

async function load(){
  const { groups } = await api('/api/contacts');
  byId.clear();
  // top stats
  const all = groups.flatMap(g=>g.contacts);
  const dist = { active:0, warm:0, cold:0, dormant:0 };
  all.forEach(c=>dist[c.strength]++);
  $('#stats').innerHTML = `
    <div class="stat"><div class="k">Contacts</div><div class="v">${all.length}</div></div>
    <div class="stat"><div class="k">Active · Warm</div><div class="v in">${dist.active} · ${dist.warm}</div></div>
    <div class="stat"><div class="k">Cold · Dormant</div><div class="v">${dist.cold} · ${dist.dormant}</div></div>`;

  await loadReconnect();

  if(!all.length){ $('#out').innerHTML = '<p class="empty">No contacts yet. Add someone above.</p>'; return; }
  $('#out').innerHTML = groups.map(g=>{
    const d = { active:0, warm:0, cold:0, dormant:0 };
    g.contacts.forEach(c=>d[c.strength]++);
    const summary = ['active','warm','cold','dormant'].filter(k=>d[k]).map(k=>`<span class="strength ${k}">${d[k]}</span>`).join(' ');
    return groupBlock(g.circle, g.count, g.contacts.map(renderContact).join(''), summary);
  }).join('');
}

async function loadReconnect(){
  const { contacts } = await api('/api/contacts/reconnect');
  const box = $('#reconnect');
  if(!contacts.length){ box.innerHTML=''; return; }
  const rows = contacts.map(c=>{
    const since = Number.isFinite(c.days_since) ? `${c.days_since}d ago` : 'never';
    return `<div class="sub"><span>⭐ <strong>${esc(c.name)}</strong> <span class="muted" style="font-size:12px">${esc([c.role,c.company].filter(Boolean).join(' · '))}</span> <span class="strength ${c.strength}" style="font-size:11px">${c.strength}</span></span>
      <span class="muted" style="font-size:12px">last: ${since}</span>
      <button class="mini" data-log="${c.id}">+ log</button></div>`;
  }).join('');
  box.innerHTML = `<section class="card" style="border-color:var(--accent)">
    <h2>Reconnect <span class="count">${contacts.length}</span>
      <button class="mini" id="gen-followups" style="float:right">generate follow-up tasks</button></h2>
    <div class="muted" style="font-size:12.5px;margin-bottom:8px">Priority contacts who have slipped out of “active”. Generate proposes reconnect todos for review.</div>
    ${rows}
  </section>`;
  $('#gen-followups').onclick = async ()=>{
    const r = await api('/api/contacts/propose-reconnects', {});
    if(r.proposed) toast(`proposed ${r.proposed} reconnect task${r.proposed===1?'':'s'} (review in Todos)`,'ok');
    else toast(`nothing new — ${r.skipped} already pending`,'');
  };
}

function renderContact(c){
  byId.set(c.id,c);
  const kv = [];
  if(c.company || c.role) kv.push(['', [c.role,c.company].filter(Boolean).join(' · ')]);
  if(c.contact_group) kv.push(['group', c.contact_group]);
  if(c.email) kv.push(['email', c.email]);
  if(c.phone) kv.push(['phone', c.phone]);
  if(c.linkedin) kv.push(['linkedin', c.linkedin]);
  if(c.met_where || c.met_date) kv.push(['met', [c.met_where,c.met_date].filter(Boolean).join(' · ')]);
  if(c.birthday) kv.push(['birthday', c.birthday]);
  const kvHtml = kv.filter(([k])=>k).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
  const roleLine = (c.role||c.company) ? `<div class="crole">${esc([c.role,c.company].filter(Boolean).join(' · '))}</div>` : '';
  const tags = (c.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ');
  const last = c.last_interaction_date
    ? `last: ${c.last_interaction_date}${c.last_interaction_note?' — '+esc(c.last_interaction_note):''}`
    : 'no interactions logged';
  return `<div class="contact">
    <div class="ctop">
      <div><div class="cname">${c.priority?'⭐ ':''}${esc(c.name)}</div>${roleLine}</div>
      <span class="strength ${c.strength}">${c.strength}</span>
    </div>
    ${kvHtml?`<dl class="kv">${kvHtml}</dl>`:''}
    <div class="muted" style="font-size:12.5px">${last} · ${c.interactions} touch${c.interactions===1?'':'es'}</div>
    ${tags?`<div class="tags">${tags}</div>`:''}
    <div class="acts">
      <button class="mini" data-log="${c.id}">+ log</button>
      <button class="mini" data-hist="${c.id}">history</button>
      <button class="mini" data-edit="${c.id}">edit</button>
    </div>
    <div class="hist" data-histbox="${c.id}"></div>
  </div>`;
}

$('#add').onclick = async ()=>{
  const name = $('#c-name').value.trim(); if(!name){ toast('name required','err'); return; }
  await api('/api/contacts', { name, role:$('#c-role').value, company:$('#c-company').value, circle:$('#c-circle').value });
  $('#c-name').value=''; $('#c-role').value=''; $('#c-company').value='';
  toast('added','ok'); load();
};

async function logInteraction(id){
  const c = byId.get(id);
  const v = await modal('Log interaction · '+esc(c.name), [
    { key:'type', label:'Type', type:'select', options:TYPES, value:'coffee' },
    { key:'date', label:'Date', type:'date', value:new Date().toISOString().slice(0,10) },
    { key:'note', label:'Note', type:'textarea', value:'' },
  ], { saveLabel:'Log' });
  if(!v) return;
  await api('/api/contacts/interaction', { id, ...v });
  toast('logged','ok'); load();
}

async function editContact(id){
  const c = byId.get(id);
  const v = await modal('Edit · '+esc(c.name), [
    { key:'name', label:'Name', value:c.name },
    { key:'role', label:'Role', value:c.role },
    { key:'company', label:'Company', value:c.company },
    { key:'circle', label:'Circle', type:'select', options:CIRCLES, value:c.circle },
    { key:'email', label:'Email', value:c.email },
    { key:'phone', label:'Phone', value:c.phone },
    { key:'linkedin', label:'LinkedIn', value:c.linkedin },
    { key:'met_where', label:'Met where', value:c.met_where },
    { key:'birthday', label:'Birthday', type:'date', value:c.birthday },
    { key:'contact_group', label:'Group', value:c.contact_group },
    { key:'tags', label:'Tags (csv)', value:(c.tags||[]).join(', ') },
    { key:'priority', label:'Priority (keep warm)', type:'select', options:['no','yes'], value:c.priority?'yes':'no' },
    { key:'strength_override', label:'Strength', type:'select', options:STRENGTHS, value:c.strength_override },
    { key:'notes', label:'Notes', type:'textarea', value:c.notes },
  ], { extraButtons:[{ label:'Delete', kind:'ghost', value:'delete' }] });
  if(!v) return;
  if(v.__action==='delete'){ await api('/api/contacts/delete',{id}); toast('deleted','ok'); load(); return; }
  v.tags = v.tags.split(',').map(t=>t.trim()).filter(Boolean);
  v.priority = v.priority==='yes' ? 1 : 0;
  await api('/api/contacts/update', { id, ...v });
  toast('saved','ok'); load();
}

async function showHistory(id){
  const box = document.querySelector(`[data-histbox="${id}"]`);
  if(box.dataset.open){ box.innerHTML=''; box.dataset.open=''; return; }
  const { interactions } = await api('/api/contacts/interactions?id='+id);
  box.dataset.open='1';
  box.innerHTML = interactions.length
    ? '<dl>'+interactions.map(i=>`<dt>${i.date} · ${esc(i.type)}</dt><dd>${esc(i.note)||'—'}</dd>`).join('')+'</dl>'
    : '<div class="muted" style="font-size:12px;margin-top:6px">no interactions yet</div>';
}

document.body.addEventListener('click', (e)=>{
  const log=e.target.closest('button[data-log]'); if(log) return logInteraction(log.dataset.log);
  const ed=e.target.closest('button[data-edit]'); if(ed) return editContact(ed.dataset.edit);
  const h=e.target.closest('button[data-hist]'); if(h) return showHistory(h.dataset.hist);
});
wireGroups();
load();
</script>
</body>
</html>
